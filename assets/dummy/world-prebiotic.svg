<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" role="img" aria-hidden="true">
  <!-- Placeholder product illustration — swap for real photography via the
       world_card block's "image" setting. -->
  <defs>
    <linearGradient id="canGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6f9c" />
      <stop offset="100%" stop-color="#ee2a2a" />
