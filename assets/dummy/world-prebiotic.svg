  </defs>

  <ellipse cx="240" cy="520" rx="180" ry="24" fill="rgba(0,0,0,0.1)" />

  <!-- Can -->
  <g>
    <rect x="150" y="60" width="180" height="420" rx="24" fill="url(#canGradient)" />
    <rect x="150" y="60" width="180" height="60" rx="24" fill="#f7f1e2" opacity="0.9" />
    <rect x="172" y="150" width="136" height="30" rx="6" fill="#f7f1e2" />
    <rect x="172" y="192" width="96" height="14" rx="4" fill="#f7f1e2" opacity="0.85" />
    <rect x="172" y="214" width="70" height="10" rx="3" fill="#f7f1e2" opacity="0.6" />
  </g>

  <!-- Person silhouette (holding a small treat) -->
  <g>
    <circle cx="120" cy="330" r="70" fill="#2b1810" />
    <path d="M60 420c0-40 30-70 60-70s60 30 60 70v90H60v-90z" fill="#2b1810" />
    <circle cx="70" cy="470" r="14" fill="#ee2a2a" />
