<!--
  Section: product_carousel

  Settings:
    - heading (text) — default: "Meet the Munchief Family"
    - enable_arrows (checkbox) — default: true; shows/hides the prev/next nav

  Blocks:
    - block type "product_card" (repeatable, 1 per product tile):
        - product (product) — Shopify product reference; supplies title,
          price, compare_at_price and featured_image automatically
        - badge_text (text) — optional corner badge label, e.g. "Best
          Seller" or "5000+ Bought This"; leave blank to hide the badge
        - badge_style (select: "green" | "orange") — default: "green"
        - rating_value (number, 0–5 step 0.5) — default: 5; static rating
          until a reviews app is wired up in Shopify
        - rating_count (number) — default: 0
        - variant_label (text) — default: "20g Tasting Pouch"; shown in the
          variant select alongside the variant price

  Fonts: heading uses "Anton" (single weight, condensed black); card/price/
  UI text uses "Comic Neue" (weight 700). Both are Google Fonts, loaded here
  for preview; in the Shopify build, load them through the theme's font
  settings or a self-hosted @font-face instead.

  Images: product pouches are dummy placeholder art (assets/dummy/pouch-*.svg)
  standing in for each block's `product.featured_image`.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Carousel — Section Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Comic+Neue:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/sections/product-carousel.css" />
</head>
<body>

  <!-- ======================================================================
       Section: Product Carousel (product_carousel)
       ====================================================================== -->
  <section class="product-carousel" aria-label="Featured products">
    <div class="container">

      <div class="product-carousel__header">
        <h2 class="product-carousel__heading">Meet the Munchief Family</h2>

        <div class="product-carousel__nav">
          <button type="button" class="btn btn--icon-circle btn--outline" data-carousel-prev aria-label="Previous product">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 6 9 12 15 18"></polyline>
            </svg>
          </button>
          <button type="button" class="btn btn--icon-circle btn--outline" data-carousel-next aria-label="Next product">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 6 15 12 9 18"></polyline>
            </svg>
          </button>
        </div>
      </div>

      <div class="product-carousel__track" data-carousel-track>

        <!-- Block: product_card (1/3) -->
        <article class="product-card">
          <div class="product-card__media">
            <span class="badge badge--green product-card__badge">5000+ Bought This</span>
            <img src="../assets/dummy/pouch-chutney-pop.svg" alt="Mimi's Chutney Pop pouch" />
          </div>

          <div class="rating">
            <span class="rating__stars" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
            </span>
            <span class="rating__count">(53)</span>
          </div>

          <h3 class="product-card__title">Mimi's Chutney Pop</h3>

          <div class="price">
            <span class="price__sale">₹99</span>
            <span class="price__compare">₹299</span>
            <span class="badge badge--green">Save ₹200</span>
          </div>

          <div class="select">
            <select class="select__input" aria-label="Variant">
              <option>20g Tasting Pouch — ₹99</option>
            </select>
            <svg class="select__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>

          <button type="button" class="btn btn--pill btn--red btn--block">Add to Cart</button>
        </article>

        <!-- Block: product_card (2/3) -->
        <article class="product-card">
          <div class="product-card__media">
            <span class="badge badge--orange product-card__badge">Best Seller</span>
            <img src="../assets/dummy/pouch-salt-pop.svg" alt="Tantan's Salt Pop pouch" />
          </div>

          <div class="rating">
            <span class="rating__stars" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
            </span>
            <span class="rating__count">(53)</span>
          </div>

          <h3 class="product-card__title">Tantan's Salt Pop</h3>

          <div class="price">
            <span class="price__sale">₹99</span>
            <span class="price__compare">₹299</span>
            <span class="badge badge--green">Save ₹200</span>
          </div>

          <div class="select">
            <select class="select__input" aria-label="Variant">
              <option>20g Tasting Pouch — ₹99</option>
            </select>
            <svg class="select__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>

          <button type="button" class="btn btn--pill btn--red btn--block">Add to Cart</button>
        </article>

        <!-- Block: product_card (3/3) -->
        <article class="product-card">
          <div class="product-card__media">
            <img src="../assets/dummy/pouch-noodle-blast.svg" alt="Chiku's Noodle Blast pouch" />
          </div>

          <div class="rating">
            <span class="rating__stars" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .587l3.668 7.431L24 9.168l-6 5.847L19.335 24 12 19.897 4.665 24 6 15.015 0 9.168l8.332-1.15z"/></svg>
            </span>
            <span class="rating__count">(53)</span>
          </div>

          <h3 class="product-card__title">Chiku's Noodle Blast</h3>

          <div class="price">
            <span class="price__sale">₹99</span>
            <span class="price__compare">₹299</span>
            <span class="badge badge--green">Save ₹200</span>
          </div>

          <div class="select">
            <select class="select__input" aria-label="Variant">
              <option>20g Tasting Pouch — ₹99</option>
            </select>
            <svg class="select__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>

          <button type="button" class="btn btn--pill btn--red btn--block">Add to Cart</button>
        </article>

      </div>
    </div>
  </section>
  <!-- ===================== /Section: Product Carousel ===================== -->

  <script>
    // Preview-only interactivity for the prev/next arrows (scrolls the track
    // by one card width). In the Shopify build this stays as a small section
    // script, not a settings-driven behavior.
    (function () {
      var section = document.currentScript.closest('section.product-carousel');
      var track = section.querySelector('[data-carousel-track]');
      var prev = section.querySelector('[data-carousel-prev]');
      var next = section.querySelector('[data-carousel-next]');

      function scrollByCard(direction) {
        var card = track.querySelector('.product-card');
        if (!card) return;
        var amount = card.getBoundingClientRect().width + 32; /* + gap */
        track.scrollBy({ left: direction * amount, behavior: 'smooth' });
      }

      prev.addEventListener('click', function () { scrollByCard(-1); });
      next.addEventListener('click', function () { scrollByCard(1); });
    })();
  </script>

</body>
</html>
