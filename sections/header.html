<!--
  Section: header

  Settings:
    - logo_image (image_picker) — default: assets/dummy/logo.png
    - logo_link (url)
    - bundle_cta_text (text) — default: "Build Your Bundle"
    - bundle_cta_link (url)
    - bundle_badge_text (text) — default: "Bestseller"
    - show_bundle_badge (checkbox) — default: true
    - account_link (url)
    - cart_link (url)
    - cart_count (number) — default: 0; drives the cart-button count bubble
      (hidden via opacity when 0, per the design spec)

  Blocks:
    - block type "nav_link" (repeatable, left-side primary nav):
        - label (text) — e.g. "Products", "Learn"
        - link (url) — used when the item has no dropdown
        - dropdown_menu (link_list, optional) — when set, the item renders
          as a disclosure button instead of a plain link; its menu's items
          render in a dropdown shown on hover (desktop pointer/keyboard,
          via :hover/:focus-within) or on click (a small script toggles an
          `.is-open` class — needed for touch devices, and so a tap "pins"
          the menu open instead of only showing while hovered)

  Fonts: nav links + action buttons use "Fredoka" (weights 500/600); the
  floating "Bestseller" ribbon uses "Poppins" (weight 500) — distinct from
  the rest of the site's "Comic Neue"/"Inter" voice, per the design spec.
  All are Google Fonts, loaded here for preview; in the Shopify build, load
  them through the theme's font settings or a self-hosted @font-face instead.

  Images: logo uses the real Munchief wordmark PNG (assets/dummy/logo.png)
  standing in for the `logo_image` image_picker — same asset reused by the
  footer section's logo.
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Header — Section Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Poppins:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/sections/header.css" />
</head>
<body>

  <!-- ======================================================================
       Section: Header (header)
       ====================================================================== -->
  <header class="site-header">
    <div class="container site-header__inner">

      <!-- Block: nav_link x2, both with a dropdown_menu -->
      <nav class="site-header__nav" aria-label="Primary">
        <div class="site-header__nav-item">
          <button type="button" class="site-header__nav-link" aria-haspopup="true" aria-expanded="false">
            Products
            <svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M3.5 5.25 7 8.75l3.5-3.5H3.5z"/></svg>
          </button>
          <div class="site-header__dropdown">
            <a href="#" class="site-header__dropdown-link">Munchief Family</a>
            <a href="#" class="site-header__dropdown-link">Munchief Sodas</a>
            <a href="#" class="site-header__dropdown-link">Combo Bundles</a>
          </div>
        </div>
        <div class="site-header__nav-item">
          <button type="button" class="site-header__nav-link" aria-haspopup="true" aria-expanded="false">
            Learn
            <svg viewBox="0 0 14 14" fill="currentColor" aria-hidden="true"><path d="M3.5 5.25 7 8.75l3.5-3.5H3.5z"/></svg>
          </button>
          <div class="site-header__dropdown">
            <a href="#" class="site-header__dropdown-link">Our Story</a>
            <a href="#" class="site-header__dropdown-link">Reviews</a>
          </div>
        </div>
      </nav>

      <a href="#" class="site-header__logo" aria-label="Munchief home">
        <img src="../assets/dummy/logo.png" alt="Munchief" />
      </a>

      <div class="site-header__actions">
        <a href="#" class="site-header__action site-header__action--bundle">
          <span class="site-header__ribbon">Bestseller</span>
          <span>Build Your Bundle</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="20 12 20 22 4 22 4 12"></polyline>
            <rect x="2" y="7" width="20" height="5"></rect>
            <line x1="12" y1="22" x2="12" y2="7"></line>
            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
          </svg>
        </a>

        <a href="#" class="site-header__action">
          <span>Account</span>
          <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0 1c-3 0-6 1.5-6 4v1h12v-1c0-2.5-3-4-6-4Z"/></svg>
        </a>

        <button type="button" class="site-header__action" aria-label="Cart, 0 items">
          <span>Cart</span>
          <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M4 6h8l-.6 7.7a1.3 1.3 0 0 1-1.3 1.2H5.9a1.3 1.3 0 0 1-1.3-1.2L4 6Z" fill="currentColor"/>
            <path d="M6 6V4.6a2 2 0 0 1 4 0V6" stroke="currentColor" stroke-width="1.3" fill="none"/>
          </svg>
          <span class="site-header__cart-count" data-count="0">0</span>
        </button>
      </div>

    </div>
  </header>
  <!-- ===================== /Section: Header ===================== -->

  <script>
    // Dropdown menus: hover/focus-within already reveals them via CSS; this
    // adds click-to-toggle (so touch devices and mouse clicks alike can
    // "pin" a menu open), closes other open menus first, and closes on an
    // outside click or Escape.
    (function () {
      var items = document.querySelectorAll('.site-header__nav-item');

      function closeAll(except) {
        items.forEach(function (item) {
          if (item === except) return;
          item.classList.remove('is-open');
          var trigger = item.querySelector('.site-header__nav-link');
          if (trigger) trigger.setAttribute('aria-expanded', 'false');
        });
      }

      items.forEach(function (item) {
        var trigger = item.querySelector('.site-header__nav-link');
        if (!trigger) return;

        trigger.addEventListener('click', function (e) {
          e.stopPropagation();
          var isOpen = item.classList.contains('is-open');
          closeAll();
          if (!isOpen) {
            item.classList.add('is-open');
            trigger.setAttribute('aria-expanded', 'true');
          } else {
            trigger.setAttribute('aria-expanded', 'false');
          }
        });
      });

      document.addEventListener('click', function () { closeAll(); });

      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        items.forEach(function (item) {
          if (!item.classList.contains('is-open')) return;
          var trigger = item.querySelector('.site-header__nav-link');
          closeAll();
          if (trigger) trigger.focus();
        });
      });
    })();
  </script>

</body>
</html>
